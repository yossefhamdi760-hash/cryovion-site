<style>
/* شارة التوثيق الذهبية الفاخرة بنمط X وفيسبوك */
.gold-badge-verified {
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  margin-inline-start: 6px;
  vertical-align: middle;
  flex-shrink: 0;
  background: linear-gradient(135deg, #FFE27A 0%, #E8B923 55%, #B8860B 100%);
  border-radius: 50%;
  box-shadow: 0 0 7px rgba(255, 215, 0, 0.5);
}
.gold-badge-verified svg {
  width: 11px;
  height: 11px;
  stroke: #0b0f19;
  stroke-width: 3.6;
  fill: none;
}
</style>

<script>
/* ======================================================================
   Cryovion: الطبقة الموحدة النهائية (مصححة بالكامل ومضمونة)
   1) الصلاحيات   2) التخصصات والمواعيد   3) العرض (شارة/هاتف/صوت)
   4) الحالات اليومية   5) التفويض   6) قاعدة البيانات   7) الجلسة
   ====================================================================== */
(function () {
  var ADMIN = 'yossefhamdi760@gmail.com';
  var DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  var BADGE = '<span class="gold-badge-verified" title="جهة رسمية موثقة"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>';
  var ADMIN_BTN_IDS = ['dockAdminBtn', 'drawerAdminBtn', 'topAdminShortcut', 'accAdminShortcut'];
  var sessEmail = null, pendingSched = null, devStatus = null, refCache = [];
  var q = Promise.resolve(), uploaded = {};

  function or(a, b) { return a ? a : b; }
  function byId(id) { return places.find(function (x) { return x.id === id; }); }
  function isAdm() { return isUserMasterAdmin(getCurrentUser()); }
  
  // دالة مزامنة صارمة تضمن ظهور أزرار غرفة التحكم للأدمن دائماً
  function sync() {
    adminUnlocked = isAdm();
    ADMIN_BTN_IDS.forEach(function (id) {
      var el = $(id);
      if (el) el.classList.toggle('hidden', !adminUnlocked);
    });
    return adminUnlocked;
  }

  function t12(t) {
    var p = t.split(':'), h = +p[0], s = h >= 12 ? 'م' : 'ص';
    h = h % 12; if (h === 0) h = 12;
    return h + (p[1] === '00' ? '' : ':' + p[1]) + ' ' + s;
  }

  /* ---------- 1) الصلاحيات: تثبيت رتبة المشرف دون سقوط الجلسة ---------- */
  MASTER_ADMIN_EMAILS.splice(0, MASTER_ADMIN_EMAILS.length, ADMIN);

  window.isUserMasterAdmin = function (u) {
    if (!u) u = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
    return !!(u && u.email && u.email.trim().toLowerCase() === ADMIN);
  };

  var _scu = window.setCurrentUser;
  window.setCurrentUser = function (u) {
    if (u && u.email) {
      var cleanEmail = u.email.trim().toLowerCase();
      if (cleanEmail === ADMIN) {
        u.role = 'مشرف';
        u.verified = true;
      } else if (sessEmail && cleanEmail === sessEmail) {
        u.verified = true;
      }
    }
    var res = _scu.call(this, u);
    sync();
    return res;
  };

  var _ru = window.refreshUserUI;
  window.refreshUserUI = function () {
    var r = _ru.apply(this, arguments);
    sync();
    return r;
  };

  var _sv = window.switchViewDOM;
  window.switchViewDOM = function (v, r) {
    sync();
    if (v === 'admin' && !adminUnlocked) v = 'home';
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    return _sv.call(this, v, r);
  };

  var _da = window.deleteAd;
  window.deleteAd = function (id) {
    if (!sync()) return toast('الحذف للأدمن فقط');
    return _da.call(this, id);
  };

  /* ---------- 2) التخصصات الجديدة ---------- */
  var NEW_SPECS = {
    surgery:   { label: 'الجراحة', labelEn: 'Surgery', icon: '⚕️', color: '#f97316', bg: 'rgba(249,115,22,0.16)' },
    nutrition: { label: 'التغذية والتخسيس', labelEn: 'Nutrition & Slimming', icon: '🥗', color: '#84cc16', bg: 'rgba(132,204,22,0.16)' },
    cosmetic:  { label: 'التجميل', labelEn: 'Cosmetic', icon: '💄', color: '#ec4899', bg: 'rgba(236,72,153,0.16)' },
    laser:     { label: 'الليزر', labelEn: 'Laser', icon: '🔆', color: '#facc15', bg: 'rgba(250,204,21,0.16)' }
  };
  Object.keys(NEW_SPECS).forEach(function (k) { SPECS_META[k] = NEW_SPECS[k]; });
  if ($('edSpecKey')) {
    $('edSpecKey').insertAdjacentHTML('beforeend',
      '<option value="surgery">⚕️ الجراحة</option><option value="nutrition">🥗 التغذية والتخسيس</option>' +
      '<option value="cosmetic">💄 التجميل</option><option value="laser">🔆 الليزر</option>');
  }

  window.renderSpecsBar = function () {
    var list = ['all', 'peds', 'gastro', 'obgyn', 'neuro', 'ortho', 'surgery', 'dental', 'eye', 'ent', 'cardio', 'physio', 'nutrition', 'cosmetic', 'laser', 'pharmacy', 'lab'];
    if (!$('specsBar')) return;
    $('specsBar').innerHTML = list.map(function (k) {
      var s = SPECS_META[k]; if (!s) return '';
      return '<button data-spec="' + k + '" class="spec-chip ' + (activeSpec === k ? 'active' : '') + '"><span style="font-size:15px;">' + s.icon + '</span><span>' + (currentLang === 'en' ? s.labelEn : s.label) + '</span></button>';
    }).join('');
  };

  /* ---------- 3) حالة النشاط حسب المواعيد والإجازات ---------- */
  window.getAvailabilityStatus = function (d) {
    var en = currentLang === 'en';
    function st(state, color, ar, e) { return { state: state, color: color, label: en ? e : ar }; }
    if (d.lamp_mode === 'open') return st('online', 'var(--emerald)', 'مفتوح الآن', 'Open Now');
    if (d.lamp_mode === 'closed') return st('offline', 'var(--rose)', 'مغلق الآن', 'Closed Now');
    if (d.lamp_mode === 'auto' && d.sched) {
      var s = d.sched, now = new Date(), off = s.off ? s.off : [];
      if (off.indexOf(now.getDay()) > -1) return st('offline', 'var(--rose)', 'إجازة اليوم', 'Day Off');
      if (s.h24) return st('online', 'var(--emerald)', 'مفتوح 24 ساعة', 'Open 24h');
      if (s.from && s.to) {
        var m = now.getHours() * 60 + now.getMinutes();
        var f = s.from.split(':'), t = s.to.split(':');
        var a = +f[0] * 60 + +f[1], b = +t[0] * 60 + +t[1];
        var isOpen = a <= b ? (m >= a && m < b) : (m >= a || m < b);
        return isOpen ? st('online', 'var(--emerald)', 'مفتوح الآن', 'Open Now') : st('offline', 'var(--rose)', 'مغلق الآن', 'Closed Now');
      }
    }
    return st('unknown', 'var(--muted)', 'لم تُفعل من المُفوض', 'Not Configured');
  };

  if ($('edLampMode')) {
    $('edLampMode').insertAdjacentHTML('afterbegin', '<option value="auto">⏱️ تلقائي حسب المواعيد</option>');
  }
  if ($('edHours') && $('edHours').parentElement) {
    $('edHours').parentElement.insertAdjacentHTML('afterend',
      '<div style="display:grid; gap:8px;">' +
      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">' +
      '<label style="font-size:11px; color:var(--muted);">من الساعة<input id="edFrom" type="time" class="input-box"></label>' +
      '<label style="font-size:11px; color:var(--muted);">إلى الساعة<input id="edTo" type="time" class="input-box"></label></div>' +
      '<label style="font-size:12px; display:flex; gap:6px; align-items:center;"><input type="checkbox" id="edH24"> مفتوح 24 ساعة</label>' +
      '<div style="font-size:11px; color:var(--emerald); font-weight:700;">أيام الإجازة (تظهر مغلق تلقائياً):</div>' +
      '<div style="display:flex; flex-wrap:wrap; gap:8px;">' +
      DAYS.map(function (n, i) { return '<label style="font-size:12px; display:inline-flex; gap:4px; align-items:center;"><input type="checkbox" class="offd" value="' + i + '">' + n + '</label>'; }).join('') +
      '</div><p style="font-size:11px; color:var(--muted);">اختر "تلقائي حسب المواعيد" لتعمل النقطة بالوقت. إن لم تُفعَّل تظهر "لم تُفعل من المُفوض".</p></div>');
  }

  $('editorForm').addEventListener('submit', function () {
    var off = [];
    document.querySelectorAll('.offd').forEach(function (c) { if (c.checked) off.push(+c.value); });
    pendingSched = { from: $('edFrom').value, to: $('edTo').value, h24: $('edH24').checked, off: off };
    if (!$('edHours').value.trim()) {
      if (pendingSched.h24) $('edHours').value = '24 ساعة';
      else if (pendingSched.from && pendingSched.to) $('edHours').value = 'من ' + t12(pendingSched.from) + ' إلى ' + t12(pendingSched.to);
    }
    setTimeout(function () { pendingSched = null; }, 0);
  }, true);

  var _oe = window.openEditorModal;
  window.openEditorModal = function (id) {
    sync();
    _oe.call(this, id);
    var p = id ? byId(id) : null, s = (p && p.sched) ? p.sched : {};
    if ($('edFrom')) $('edFrom').value = or(s.from, '');
    if ($('edTo')) $('edTo').value = or(s.to, '');
    if ($('edH24')) $('edH24').checked = !!s.h24;
    document.querySelectorAll('.offd').forEach(function (c) { c.checked = (s.off ? s.off : []).indexOf(+c.value) > -1; });
    if (!p && $('edLampMode')) $('edLampMode').value = 'auto';
    // إخفاء وقفل خيار التوثيق تماماً عن غير الأدمن
    if ($('edIsVerified')) {
      $('edIsVerified').disabled = !adminUnlocked;
      var verBox = $('edIsVerified').closest('label') || $('edIsVerified').parentElement.parentElement;
      if (verBox) verBox.classList.toggle('hidden', !adminUnlocked);
    }
  };

  window.quickToggleLamp = async function (id) {
    var p = byId(id); if (!p) return;
    var order = ['auto', 'open', 'closed', 'unknown'];
    var nx = order[(order.indexOf(p.lamp_mode) + 1) % 4];
    saveCustomOverride(Object.assign({}, p, { lamp_mode: nx }));
    await load(); renderManagedAds();
    toast({ auto: '⏱️ تلقائي حسب المواعيد', open: '🟢 مفتوح الآن', closed: '🔴 مغلق الآن', unknown: '⚪ لم تُفعل من المُفوض' }[nx]);
  };

  function recompute() {
    places.forEach(function (p) { var a = getAvailabilityStatus(p); p.avail_state = a.state; p.avail_label = a.label; p.avail_color = a.color; });
    if (currentViewName === 'home') render();
  }
  setInterval(recompute, 60000);
  /* ---------- 4) العرض: الشارة الذهبية المضمونة + القراءة الصوتية ---------- */
  var VER_ON = /<span[^>]*>✔\s*موثق ورسمي<\/span>/g;
  var _card = window.card;
  window.card = function (d) {
    var v = !!d.is_verified;
    var h = _card.call(this, Object.assign({}, d, { is_verified: true }));
    // استبدال النص القديم بعلامة قيد التدقيق لغير الموثق، أو مسحه للموثق لأن الشارة بجانب الاسم تكفي
    h = h.replace(VER_ON, function () { return v ? '' : '<span style="color:var(--muted); font-size:11px;">⏳ قيد التدقيق</span>'; });
    // حقن الشارة الذهبية بجانب الاسم بأمان مهما كانت بنية الـ HTML
    if (v && d.name) {
      var safeName = esc(d.name);
      var spanTarget = '<span>' + safeName + '</span>';
      if (h.indexOf(spanTarget) !== -1) {
        h = h.replace(spanTarget, spanTarget + BADGE);
      } else {
        h = h.replace(safeName, safeName + BADGE);
      }
    }
    return h;
  };

  function ttsText(p) {
    var t = 'مرحباً بك في ' + p.name + '. ';
    if (p.spec) t += 'التخصص: ' + p.spec + '. ';
    if (p.bio) t += p.bio + '. ';
    if (p.hours && p.hours !== 'غير معروف' && p.hours !== 'لم تُفعل من المُفوض') t += 'مواعيد العمل: ' + p.hours + '. ';
    if (p.addr && p.addr !== 'غير معروف') t += 'العنوان: ' + p.addr + '. ';
    return t;
  }
  function ttsButton(p) {
    var b = document.createElement('button');
    b.type = 'button'; b.id = 'ttsBtn';
    b.style.cssText = 'padding:10px 14px; border-radius:10px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; margin:10px 0; width:100%; justify-content:center; border:1px solid rgba(16,185,129,0.3); cursor:pointer;';
    function idle() { b.textContent = '🔊 استماع للبيانات الصوتية'; b.style.background = 'rgba(16,185,129,0.15)'; b.style.color = 'var(--emerald)'; }
    function busy() { b.textContent = '⏹️ إيقاف القراءة الصوتية'; b.style.background = 'rgba(244,63,94,0.18)'; b.style.color = 'var(--rose)'; }
    idle();
    b.addEventListener('click', function () {
      if (!window.speechSynthesis) return toast('المتصفح لا يدعم القراءة الصوتية');
      if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); idle(); return; }
      var m = new SpeechSynthesisUtterance(ttsText(p));
      m.lang = 'ar-SA'; m.rate = 0.9; m.onstart = busy; m.onend = idle; m.onerror = idle;
      window.speechSynthesis.speak(m);
    });
    return b;
  }

  var _rp = window.renderPlacePageDOM;
  window.renderPlacePageDOM = function (id) {
    sync();
    var p = byId(id), v = !!(p && p.is_verified), g = '';
    if (p && p.gallery && p.gallery.length > 1) {
      g = '<div style="display:flex; gap:8px; overflow-x:auto; margin-top:18px;">' + p.gallery.map(function (s) {
        return '<img src="' + esc(s) + '" style="width:110px; height:110px; object-fit:cover; border-radius:12px; border:1px solid var(--border);">';
      }).join('') + '</div>';
    }
    window.galleryHtml = g;
    if (p) p.is_verified = true;
    try { _rp.call(this, id); } finally { if (p) p.is_verified = v; }
    var box = $('placePageContent');
    if (box) {
      var h1 = box.querySelector('h1, h2, .place-title'), td = box.querySelector('.noon-table td');
      if (h1 && v && !h1.querySelector('.gold-badge-verified')) h1.insertAdjacentHTML('beforeend', BADGE);
      if (td && !v) td.innerHTML = '<span style="color:var(--muted);">⏳ جاري جمع وتدقيق البيانات</span>';
      if (p && !$('ttsBtn')) box.insertAdjacentElement('afterbegin', ttsButton(p));
    }
  };

  /* ---------- 5) الحالات اليومية + حالة Cryovion الرسمية ---------- */
  window.renderPostersCarousel = function () {
    var track = $('posterTrack'); if (!track) return;
    var now = Date.now(), day = 86400000, html = '';
    if (devStatus && now - devStatus.ts <= day) {
      html += '<div class="poster-card" style="border-color:var(--gold); cursor:default;"><div class="poster-top-quarter">' +
        '<div style="display:flex; align-items:center; gap:7px;"><span class="brand-mark gold-bg" style="width:28px; height:28px; border-radius:8px; font-size:14px;">C</span>' +
        '<span class="brand-text font-display" style="font-size:18px;">Cryovion</span>' + BADGE + '</div>' +
        '<span class="badge-pill gold-bg" style="font-size:10px; padding:2px 9px;">تحديث رسمي</span></div>' +
        '<div class="poster-bio-body">' + esc(devStatus.text) + '</div></div>';
    }
    places.forEach(function (d) {
      if (!d.bio) return;
      if (d.bio_ts && now - d.bio_ts > day) return;
      var sp = SPECS_META[d.spec_key] ? SPECS_META[d.spec_key] : SPECS_META.gastro;
      var thumb = d.photo_url ? '<img src="' + esc(d.photo_url) + '" class="poster-mini-thumb" alt="">' : '<span class="poster-mini-thumb t-' + d.cat + '">' + sp.icon + '</span>';
      var wa = formatWaNumber(or(d.whatsapp, d.phone)), foot = '';
      if (d.phone) {
        foot = '<div style="display:flex; gap:6px; padding-top:6px;"><a href="tel:' + esc(d.phone) + '" style="background:var(--emerald); color:#fff; padding:4px 10px; border-radius:8px; font-size:11.5px; font-weight:700;">📞 ' + esc(d.phone) + '</a>' +
          (wa ? '<a href="https://wa.me/' + wa + '" target="_blank" style="background:var(--whatsapp); color:#fff; padding:4px 10px; border-radius:8px; font-size:11.5px; font-weight:700;">💬</a>' : '') + '</div>';
      }
      html += '<div data-act="openPage" data-id="' + d.id + '" class="poster-card"><div class="poster-top-quarter">' +
        '<div style="display:flex; align-items:center; gap:7px; min-width:0;">' + thumb + '<span style="font-size:13px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + esc(d.name) + '</span>' + (d.is_verified ? BADGE : '') + '</div>' +
        '<span style="display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; color:' + d.avail_color + '; flex-shrink:0;"><span class="status-dot ' + d.avail_state + '"></span><span>' + esc(d.avail_label) + '</span></span></div>' +
        '<div class="poster-bio-body">' + esc(d.bio) + '</div>' + foot + '</div>';
    });
    track.innerHTML = html;
    clearInterval(posterTimer);
    posterTimer = setInterval(function () {
      var mx = track.scrollWidth - track.clientWidth;
      if (Math.abs(track.scrollLeft) >= mx - 20) track.scrollTo({ left: 0, behavior: 'smooth' });
      else track.scrollBy({ left: -354, behavior: 'smooth' });
    }, 4200);
  };

  if ($('adminDashboardContent') && !$('devText')) {
    $('adminDashboardContent').insertAdjacentHTML('afterbegin',
      '<div class="entity-card" style="border-color:var(--gold); display:grid; gap:8px; cursor:default;">' +
      '<b style="color:var(--gold);">📣 حالة رسمية من Cryovion (تظهر 24 ساعة في الشريط)</b>' +
      '<textarea id="devText" rows="2" class="input-box" placeholder="تحديث جديد، ميزة، إعلان للمستخدمين..."></textarea>' +
      '<div style="display:flex; gap:8px;"><button type="button" id="devPub" class="gold-bg" style="flex:1; padding:10px; border-radius:10px; font-size:13px;">نشر باسم Cryovion ✔</button>' +
      '<button type="button" id="devDel" style="padding:10px 14px; border-radius:10px; background:rgba(244,63,94,0.18); color:var(--rose); font-weight:700; font-size:12px;">حذف</button></div></div>');

    $('devPub').addEventListener('click', function () {
      var t = $('devText').value.trim(); if (!t) return toast('اكتب نص الحالة أولاً');
      devStatus = { text: t, ts: Date.now() };
      renderPostersCarousel(); toast('✔ تم نشر حالة Cryovion');
      if (db) q = q.then(function () { return db.from('site_status').upsert({ id: 1, text: devStatus.text, ts: devStatus.ts }); })
        .then(function (r) { if (r && r.error) toast('رُفض النشر: ' + r.error.message); }).catch(function () {});
    });
    $('devDel').addEventListener('click', function () {
      devStatus = null; $('devText').value = ''; renderPostersCarousel(); toast('تم حذف الحالة');
      if (db) q = q.then(function () { return db.from('site_status').delete().eq('id', 1); }).catch(function () {});
    });
  }

  var _rm = window.renderManagedAds;
  window.renderManagedAds = function () {
    _rm.apply(this, arguments);
    document.querySelectorAll('#managedListBox > .entity-card').forEach(function (el) {
      var m = el.innerHTML.match(/openEditorModal\('([^']+)'\)/);
      if (!m || el.querySelector('.qs')) return;
      var id = m[1], p = byId(id), box = document.createElement('div');
      box.className = 'qs';
      box.style.cssText = 'background:rgba(217,180,90,0.08); border:1px solid var(--border); border-radius:14px; padding:12px; display:grid; gap:8px;';
      box.innerHTML = '<b style="font-size:13px; color:var(--gold);">📢 انشر حالتك اليومية (تظهر 24 ساعة)</b>' +
        '<textarea class="input-box qsText" rows="2" placeholder="مثال: متاح كشف الليلة حتى 9 مساءً..."></textarea>' +
        '<div style="display:flex; gap:8px;"><button type="button" class="gold-bg qsPub" style="flex:1; padding:10px; border-radius:10px; font-size:13px;">نشر الحالة ✔</button>' +
        '<button type="button" class="qsDel" style="padding:10px 14px; border-radius:10px; background:rgba(244,63,94,0.18); color:var(--rose); font-weight:700; font-size:12px;">حذف</button></div>';
      el.appendChild(box);
      box.querySelector('.qsText').value = p ? or(p.bio, '') : '';
      function save(text) {
        var cur = byId(id); if (!cur) return;
        if (containsDefamation(text)) return toast('🚫 النص يحتوي على كلمات غير مسموح بها');
        saveCustomOverride(Object.assign({}, cur, { bio: text, bio_ts: Date.now() }));
        load().then(function () { renderManagedAds(); toast(text ? '✔ تم نشر حالتك' : 'تم حذف الحالة'); });
      }
      box.querySelector('.qsPub').addEventListener('click', function () {
        var t = box.querySelector('.qsText').value.trim(); if (!t) return toast('اكتب الحالة أولاً'); save(t);
      });
      box.querySelector('.qsDel').addEventListener('click', function () { save(''); });
    });
  };

  /* ---------- 6) التفويض (يمنح التوثيق تلقائياً، والأدمن فقط يملكه) ---------- */
  window.delegatePage = function (id) {
    if (!sync()) return toast('التفويض للأدمن فقط');
    var p = byId(id); if (!p) return;
    var em = prompt('اكتب إيميل صاحب الصفحة لتفويضه بالتحكم الكامل في "' + p.name + '" (اتركه فارغاً لإلغاء التفويض):', or(p.owner_email, ''));
    if (em === null) return;
    em = em.trim().toLowerCase();
    if (em && em.indexOf('@') < 0) return toast('إيميل غير صحيح');
    saveCustomOverride(Object.assign({}, p, { owner_email: em, is_verified: em ? true : p.is_verified }));
    load().then(function () {
      renderAdminList();
      if (!em) return toast('تم إلغاء التفويض');
      var msg = 'تم تفويض إيميلك (' + em + ') للتحكم الكامل بصفحة "' + p.name + '" على Cryovion. سجّل الدخول بهذا الإيميل عبر Google من ' + location.origin + ' ثم افتح "إدارة صفحتي".';
      try { navigator.clipboard.writeText(msg); } catch (e) {}
      toast('✔ تم التفويض والتوثيق ونُسخت رسالة الدعوة لتبعثها له');
    });
  };

  var _ral = window.renderAdminList;
  window.renderAdminList = function () {
    _ral.apply(this, arguments);
    document.querySelectorAll('#adminAllPlacesList > .entity-card').forEach(function (el) {
      var m = el.innerHTML.match(/openEditorModal\('([^']+)'\)/);
      if (!m || el.querySelector('.deleg')) return;
      var b = document.createElement('button');
      b.className = 'deleg'; b.type = 'button'; b.textContent = '🔑 تفويض';
      b.style.cssText = 'background:rgba(16,185,129,0.2); color:var(--emerald); padding:7px 12px; border-radius:9px; font-size:12px; font-weight:700;';
      b.addEventListener('click', function () { delegatePage(m[1]); });
      el.lastElementChild.prepend(b);
    });
  };

  /* ---------- 7) قاعدة البيانات السحابية المشتركة (Supabase) ---------- */
  var _sco = window.saveCustomOverride;
  window.saveCustomOverride = function (item) {
    if (pendingSched && item && !item.deleted) { item.sched = pendingSched; pendingSched = null; }
    if (!db) { return _sco.call(this, item); }
    if (!item.deleted && !item.name) return;
    var copy = JSON.parse(JSON.stringify(item));
    q = q.then(function () { return dbWrite(copy); }).catch(function (e) { console.error(e); toast('تعذر الحفظ في قاعدة البيانات'); });
  };

  if (db) {
    var COLS = 'id,cat,spec_key,name,spec,bio,bio_ts,photo_url,gallery,addr,hours,lamp_mode,sched,phone,whatsapp,fee,map_url,is_verified,ref_count,status,created_at,updated_at';
    var sess = function () { return db.auth.getSession().then(function (r) { return r.data.session; }); };

    var compress = function (url) {
      return new Promise(function (res, rej) {
        var i = new Image();
        i.onload = function () {
          var k = Math.min(1, 900 / i.width), c = document.createElement('canvas');
          c.width = i.width * k; c.height = i.height * k;
          c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
          c.toBlob(function (b) { if (b) res(b); else rej(); }, 'image/jpeg', 0.82);
        };
        i.onerror = rej; i.src = url;
      });
    };
    var pub = async function (src, uid) {
      if (!src || src.indexOf('data:') !== 0) return src;
      if (uploaded[src]) return uploaded[src];
      var blob = await compress(src);
      var path = uid + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
      var r = await db.storage.from('place-photos').upload(path, blob, { contentType: 'image/jpeg' });
      if (r.error) throw r.error;
      uploaded[src] = db.storage.from('place-photos').getPublicUrl(path).data.publicUrl;
      return uploaded[src];
    };

    var dbWrite = async function (it) {
      var s = await sess();
      if (!s) { if (getCurrentUser()) toast('انتهت الجلسة، سجّل الدخول عبر Google من جديد'); return; }
      var admin = isAdm();
      if (it.deleted) {
        if (!admin) return;
        var d = await db.from('places').delete().eq('id', it.id);
        if (d.error) toast('تعذر الحذف: ' + d.error.message);
        return;
      }
      if (!admin && !byId(it.id)) { toast('إضافة الصفحات للأدمن فقط'); return; }
      var gal = it.gallery ? it.gallery : [];
      var row = {
        id: it.id, cat: it.cat, spec_key: it.spec_key, name: it.name, spec: or(it.spec, ''),
        bio: or(it.bio, ''), bio_ts: or(it.bio_ts, null), photo_url: await pub(it.photo_url, s.user.id),
        gallery: await Promise.all(gal.map(function (g) { return pub(g, s.user.id); })),
        addr: or(it.addr, ''), hours: or(it.hours, 'غير معروف'), lamp_mode: or(it.lamp_mode, 'unknown'),
        sched: or(it.sched, null), phone: or(it.phone, null), whatsapp: or(it.whatsapp, null),
        fee: or(it.fee, null), map_url: or(it.map_url, null)
      };
      var res;
      if (admin) {
        row.is_verified = !!it.is_verified;
        row.owner_email = it.owner_email ? it.owner_email.toLowerCase() : null;
        row.ref_count = or(it.ref_count, 0);
        row.status = 'approved';
        res = await db.from('places').upsert(row);
      } else {
        res = await db.from('places').update(row).eq('id', it.id);
      }
      if (res.error) { console.error(res.error); toast('رُفض الحفظ: ' + res.error.message); }
    };

    window.saveLocalReview = function (rv) {
      q = q.then(function () {
        return db.from('reviews').insert({ place_id: rv.place_id, author: rv.author, stars: rv.stars, body: rv.body });
      }).then(function (r) { if (r && r.error) toast('تعذر نشر التقييم'); }).catch(function () {});
    };
    window.getRefRequests = function () { return refCache; };
    window.saveRefRequest = function (rq) {
      q = q.then(async function () {
        var s = await sess(); if (!s) return;
        var r = await db.from('ad_requests').insert({ user_id: s.user.id, user_name: rq.user_name, user_email: s.user.email,
          title: rq.title, type: rq.type, phone: rq.phone, description: rq.desc });
        if (r.error) toast('تعذر إرسال الطلب');
      }).catch(function () {});
    };

    window.load = async function () {
      try { await q; } catch (e) {}
      var rows = [], revs = [], failed = false;
      var r = await Promise.all([
        db.from('places').select(COLS).eq('status', 'approved').order('created_at', { ascending: false }),
        db.from('reviews').select('*').order('created_at', { ascending: false }),
        db.from('site_status').select('*').eq('id', 1).maybeSingle()
      ]);
      if (r[0].error) { failed = true; console.error(r[0].error); } else { rows = r[0].data ? r[0].data : []; }
      revs = r[1].data ? r[1].data : [];
      devStatus = r[2].data ? { text: r[2].data.text, ts: r[2].data.ts } : null;

      if (failed) { rows = DEFAULT_DIRECTORY.map(function (x) { return Object.assign({}, x); }); }
      else if (!rows.length && isAdm()) {
        rows = DEFAULT_DIRECTORY.map(function (x) { return Object.assign({}, x); });
        q = q.then(function () { return Promise.all(rows.map(function (x) { return dbWrite(x); })); }).catch(function () {});
      }

      places = rows.map(function (d) {
        var rv = revs.filter(function (x) { return x.place_id === d.id; }).map(function (x) {
          return { author: x.author, stars: x.stars, body: x.body, date: (x.created_at ? x.created_at.slice(0, 10) : '') };
        });
        var rated = rv.filter(function (x) { return x.stars > 0; });
        var o = Object.assign({}, d, {
          hours: or(d.hours, 'غير معروف'), addr: or(d.addr, 'غير معروف'), bio: or(d.bio, ''),
          gallery: d.gallery ? d.gallery : [], phone: or(d.phone, null), whatsapp: or(d.whatsapp, null),
          fee: or(d.fee, ''), map_url: or(d.map_url, ''), reviews: rv, n: rated.length,
          rate: rated.length ? Math.round(rated.reduce(function (a, x) { return a + x.stars; }, 0) / rated.length * 10) / 10 : 5,
          updated_date: d.updated_at ? d.updated_at.slice(0, 10) : or(d.updated_date, '')
        });
        var a = getAvailabilityStatus(o);
        o.avail_state = a.state; o.avail_label = a.label; o.avail_color = a.color;
        return o;
      });

      var s = await sess();
      if (s) {
        var m = await db.rpc('my_places_meta');
        (m.data ? m.data : []).forEach(function (x) { var p = byId(x.id); if (p) p.owner_email = x.owner_email; });
      }
      if (isAdm()) {
        var rq = await db.from('ad_requests').select('*').order('created_at', { ascending: false });
        refCache = (rq.data ? rq.data : []).map(function (x) { return Object.assign({}, x, { desc: x.description, refs: '—' }); });
        if ($('devText')) $('devText').value = devStatus ? devStatus.text : '';
      } else { refCache = []; }

      refreshUserUI(); render(); renderPostersCarousel();
      if (currentViewName === 'admin') renderAdminList();
    };
  }

  /* ---------- 8) الجلسة والأزرار ---------- */
  if ($('googleDirectBtn')) {
    $('googleDirectBtn').addEventListener('click', async function (e) {
      e.stopImmediatePropagation();
      if (!db) return toast('الخدمة غير متاحة حالياً');
      var res = await db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
      if (res.error) toast('تعذر الدخول عبر Google');
    }, true);
  }

  async function applySession(s) {
    sessEmail = (s && s.user && s.user.email) ? s.user.email.trim().toLowerCase() : null;
    if (s && s.user) {
      var e = s.user.email.trim().toLowerCase(), md = s.user.user_metadata ? s.user.user_metadata : {};
      var nm = md.full_name ? md.full_name : (md.name ? md.name : e.split('@')[0]);
      setCurrentUser({ name: nm, email: e, role: e === ADMIN ? 'مشرف' : 'عضو', uid: s.user.id, provider: 'google', verified: true });
    }
    sync();
    refreshUserUI();
  }

  var lastNav = 0;
  function navTap(e) {
    var b = e.target.closest('[data-nav]'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var t = Date.now(); if (t - lastNav < 450) return;
    lastNav = t; navigateApp(b.dataset.nav);
  }
  [document.querySelector('.right-icon-dock'), $('sideDrawer')].forEach(function (box) {
    if (!box) return;
    box.style.touchAction = 'manipulation';
    ['pointerup', 'click'].forEach(function (ev) { box.addEventListener(ev, navTap, true); });
  });

  if (db) {
    db.auth.onAuthStateChange(function (_e, s) { setTimeout(function () { applySession(s).then(function () { return load(); }); }, 0); });
    db.auth.getSession().then(function (r) { return applySession(r.data.session); }).then(function () { return load(); });
  }
  sync(); renderSpecsBar();
})();
</script>
</body>
</html>
